<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Playground</title>
<link rel="stylesheet" href="../shared/deck.css">
<link rel="stylesheet" href="../shared/codepad.css?v=2">
</head>
<body class="playground">
<div class="bar">
  <a href="../">← Class site</a>
  <b>Code Playground</b>
  <span>JavaScript on the left, Python on the right. <b>Ctrl+S</b> saves, then type <code>node scratch.js</code> or <code>python3 scratch.py</code> in the terminal below (or press <b>Run</b>). Nothing leaves the page.</span>
  <span>The editor and Python take a few seconds to load the first time.</span>
</div>
<div class="vscode" data-folder="playground">
<script type="text/plain" data-file="scratch.js" data-start>// JavaScript: run with  node scratch.js
let userName = "Alex";
console.log("Hello, " + userName);
</script>
<script type="text/plain" data-file="scratch.py" data-start># Python: run with  python3 scratch.py
user_name = "Alex"
print("Hello, " + user_name)
</script>
</div>
<script src="../shared/codepad.js?v=2"></script>
</body>
</html>
